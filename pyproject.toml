[project]
name = "kaller"
version = "0.1.0"
description = "A room assistant that finds and runs the actions a room asks for"
readme = "README.md"
authors = [
    { name = "Johannes Roos", email = "jhnnsrs@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "arkitekt[all]>=14.0",
    # alpaka.aopenai: the model, streamed through alpaka's tunnel.
    "alpaka[openai]>=3.5",
    # checkoutAgent (read_state).
    "rekuest>=13.1",
    # The app store search (find_installable).
    "kabinet>=8",
    "mikro>=12.2",
    # The read-only GraphQL tools build and validate against the schemas.
    "graphql-core>=3.2",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.semantic_release]
version_variables = ["app.py:__version__"]
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.branches.release]
match = "main"
prerelease = false

[tool.ruff.lint]
extend-select = ["UP"]
extend-ignore = ["UP037", "UP038", "UP042", "UP040", "UP046", "UP047", "UP049"]
